name: quesgen
description: QuesGen question paper generator.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.3
  http: ^1.6.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
